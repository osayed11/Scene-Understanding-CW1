name: kitti06
settings_file: settings/KITTI04-12.yaml   # relative to third_party/pyslam
video: data/kitti06/video_color.mp4       # colour video shipped with pySLAM (data/videos/kitti06); the brief names this as the source
images: data/kitti06/image_2              # frames extracted from the video (000000.png ...), for the depth network in Part 2
timestamps: data/kitti06/times.txt
groundtruth: data/kitti06/groundtruth.txt # already TUM-style: t tx ty tz qx qy qz qw (+ extra column)
poses_kitti: data/kitti06/06.txt          # original KITTI 3x4 poses
depth_gt: null                            # no depth ground truth
depth_pred: depth_maps/kitti06
frame_list: data/kitti06/times.txt            # one line per frame
depth_factor: 256        # 16-bit PNG = metres * factor: cap 256 m (KITTI depths reach ~80 m); needs a KITTI settings file with DepthMapFactor: 256 for pseudo RGB-D (Part 3)
